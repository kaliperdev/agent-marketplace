[project]
name = "github-agent"
version = "2.0.0"
description = "GitHub as an agent service: its tools over MCP (POST /mcp, GET /health)."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "langchain-core>=1.0", "agent-kit"]

[tool.uv.sources]
agent-kit = { path = "../kit" }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["github_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
