[project]
name = "zoho-crm-data-insights-agent-draft"
version = "0.0.0"
description = "Non-publishable Zoho CRM Data Insights transport scaffold."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "agent-kit"]

[tool.uv.sources]
agent-kit = { path = "../kit" }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zoho_crm_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
