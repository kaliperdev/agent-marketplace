[project]
name = "textql-agent"
version = "2.0.0"
description = "TextQL's Ana as an agent service: POST /ask, GET /health."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["textql_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
