[project]
name = "agent-kit"
version = "0.1.0"
description = "Shared by Kaliper's agent services: serve LangChain tools as an MCP server, plus the rows and cache helpers the tools use."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "langchain-core>=1.0"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
