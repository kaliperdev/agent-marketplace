[project]
name = "agent-marketplace"
version = "0.1.0"
description = "The global agent catalog: its database, the catalog tool, and the read-only catalog service."
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2"]

[project.scripts]
catalog = "marketplace.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["marketplace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
